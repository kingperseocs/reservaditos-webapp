<table mat-table [dataSource]="requests()" [trackBy]="trackById" class="requests-table">
  <ng-container matColumnDef="resident">
    <th mat-header-cell *matHeaderCellDef>Residente</th>
    <td mat-cell *matCellDef="let request">
      <span class="resident">
        <app-initials-avatar [name]="request.resident.name" />
        <span class="resident-name">{{ request.resident.name }}</span>
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="apartment">
    <th mat-header-cell *matHeaderCellDef>Depto</th>
    <td mat-cell *matCellDef="let request">{{ request.resident.apartment ?? '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="area">
    <th mat-header-cell *matHeaderCellDef>Área</th>
    <td mat-cell *matCellDef="let request">{{ request.area.name }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let request">{{ request.date | shortDate }}</td>
  </ng-container>

  <ng-container matColumnDef="slot">
    <th mat-header-cell *matHeaderCellDef>Horario</th>
    <td mat-cell *matCellDef="let request">{{ request.slot.label }}</td>
  </ng-container>

  <ng-container matColumnDef="requestedAt">
    <th mat-header-cell *matHeaderCellDef>Pedida hace</th>
    <td mat-cell *matCellDef="let request">
      <span class="requested-at">
        {{ request.requestedAt | relativeTime: now() }}
        @if (request.firstInLine) {
          <app-status-chip variant="info">Pedida primero</app-status-chip>
        }
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-header">Acciones</th>
    <td mat-cell *matCellDef="let request">
      <span class="actions">
        <button
          mat-stroked-button
          class="rs-button-danger-outline"
          [disabled]="busyIds().has(request.id)"
          [attr.aria-label]="'Rechazar solicitud de ' + request.resident.name"
          (click)="reject.emit(request)"
        >
          Rechazar
        </button>
        <button
          mat-flat-button
          [disabled]="busyIds().has(request.id)"
          [attr.aria-label]="'Aprobar solicitud de ' + request.resident.name"
          (click)="approve.emit(request)"
        >
          Aprobar
        </button>
      </span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr
    mat-row
    *matRowDef="let request; columns: columns"
    [class.row--new]="newIds().has(request.id)"
  ></tr>
</table>
